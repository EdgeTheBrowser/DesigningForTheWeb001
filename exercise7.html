<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7 | Light &amp; Form</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18352f;
      --paper: #f3f1e9;
      --accent: #c65d3a;
      --line: #c9cec2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 64px 24px 80px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#18352f12 0.7px, transparent 0.7px);
      background-size: 9px 9px;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      font-weight: 400;
      line-height: 0.98;
    }

    .intro {
      max-width: 490px;
      margin: 20px auto 48px;
      color: #53635b;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
    }

    figure {
      width: min(100%, 420px);
      margin: 0;
    }

    .image-table {
      width: 100%;
      border: 1px solid var(--line);
      border-spacing: 0;
      background: #fffdf7;
      box-shadow: 9px 9px 0 #18352f18;
      transition: box-shadow 250ms ease, transform 250ms ease, border-color 250ms ease;
    }

    .image-table:hover {
      border-color: var(--accent);
      box-shadow: 14px 14px 0 #c65d3a30;
      transform: translate(-3px, -3px);
    }

    .image-table td {
      padding: 10px;
    }

    .image-table img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: opacity 300ms ease, filter 300ms ease, transform 400ms ease;
    }

    figure:first-child .image-table img {
      opacity: 0.68;
    }

    figure:first-child .image-table:hover img {
      opacity: 1;
      filter: saturate(1.18);
      transform: scale(0.985);
    }

    figure:last-child .image-table img {
      opacity: 0.88;
      filter: grayscale(28%);
    }

    figure:last-child .image-table:hover img {
      opacity: 0.62;
      filter: grayscale(0%);
      transform: scale(1.015);
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 2px 0;
      color: #53635b;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.78rem;
      text-align: left;
    }

    figcaption span:last-child {
      color: var(--accent);
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      body {
        padding: 46px 18px 56px;
      }

      .intro {
        margin-bottom: 34px;
      }

      .gallery {
        gap: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A study in image and light</p>
    <h1>Light &amp; Form</h1>
    <p class="intro">Two views of the natural world, framed simply and revealed differently on hover.</p>

    <section class="gallery" aria-label="Image studies">
      <figure>
        <table class="image-table" aria-label="Forest image frame">
          <tbody>
            <tr>
              <td>
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Sunlight filtering through a dense green forest">
              </td>
            </tr>
          </tbody>
        </table>
        <figcaption><span>01 / Woodland</span><span>Soft focus</span></figcaption>
      </figure>

      <figure>
        <table class="image-table" aria-label="Coast image frame">
          <tbody>
            <tr>
              <td>
                <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Quiet ocean coastline beneath a pale open sky">
              </td>
            </tr>
          </tbody>
        </table>
        <figcaption><span>02 / Coastline</span><span>Changing tone</span></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
